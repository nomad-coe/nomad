services:
  # the search engine
  elastic:
    restart: "no"
    image: elasticsearch:7.17.24
    container_name: nomad_elastic
    environment:
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.flood_stage=1gb
      - cluster.routing.allocation.disk.watermark.low=4gb
      - cluster.routing.allocation.disk.watermark.high=2gb
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - nomad_elastic:/usr/share/elasticsearch/data
  # the user data db
  mongo:
    restart: "no"
    image: mongo:5
    container_name: nomad_mongo
    environment:
      - MONGO_DATA_DIR=/data/db
      - MONGO_LOG_DIR=/dev/null
    ports:
      - "27017:27017"
    volumes:
      - nomad_mongo:/data/db
      - nomad_mongo_config:/data/configdb
  # temporal orchestrator
  temporal:
    container_name: nomad_temporal
    image: ghcr.io/fairmat-nfdi/temporal-dev-server:v1.4.0
    volumes:
      - nomad_temporal:/data
    ports:
      - "7233:7233"
      - "8080:8080"
  seaweedfs:
    image: chrislusf/seaweedfs:4.25
    restart: no
    container_name: seaweedfs
    ports:
      - "8333:8333"
    volumes:
      - nomad_seaweedfs:/data
volumes:
  nomad_mongo:
  nomad_mongo_config:
  nomad_elastic:
  nomad_temporal:
  nomad_seaweedfs:
